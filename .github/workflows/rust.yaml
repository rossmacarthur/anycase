name: rust

on: [push, pull_request]

defaults:
  run:
    shell: bash
    working-directory: ./rust

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: --deny warnings

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Rustfmt
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy --all-targets

    - name: Test
      run: cargo test --all-targets
